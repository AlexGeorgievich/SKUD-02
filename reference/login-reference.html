<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>TimeTrack Pro — Портал | PPL Group</title><style>
#tt-concepts{--tt-blue:#2563eb;--tt-navy:#0f172a;--tt-ink:#15213b;--tt-muted:#64748b;--tt-line:#e2e8f0;--tt-radius:20px;font-family:Inter,"Segoe UI",Arial,sans-serif;position:relative;width:100%;color:#15213b;box-sizing:border-box}
#tt-concepts *{box-sizing:border-box}
#tt-concepts button{font:inherit;cursor:pointer}
#tt-concepts button:focus-visible{outline:3px solid #60a5fa;outline-offset:4px}
#tt-concepts button{touch-action:manipulation}
#tt-concepts .tt-switch{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 16px}
#tt-concepts .tt-switch button{background:#f1f5f9;border:1px solid #dbe3ef;color:#475569;border-radius:10px;padding:14px 8px;font-size:13px;text-align:left;display:flex;gap:10px;align-items:center;min-height:46px}
#tt-concepts .tt-switch button span{font-size:11px;opacity:.75}
#tt-concepts .tt-switch button[aria-pressed=true]{background:#0f172a;color:#fff;border-color:#0f172a}
#tt-concepts .tt-caption{display:flex;justify-content:space-between;gap:12px;color:#64748b;font-size:11px;margin:0 2px 10px;flex-wrap:wrap;letter-spacing:.025em}
#tt-concepts .tt-caption>span:last-child{font-size:10px;letter-spacing:.12em}
#tt-concepts .tt-page{background:#f8fafc;overflow:hidden;position:relative;color:#15213b;min-width:0}
#tt-concepts .tt-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:25px 38px;position:relative;z-index:2}
#tt-concepts .tt-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
#tt-concepts .tt-logomark{display:grid;place-items:center;width:33px;height:33px;background:var(--tt-blue);color:white;border-radius:9px;font-size:21px;font-weight:600;letter-spacing:-2px;padding-right:2px}
#tt-concepts .tt-brand-name{display:block;font-weight:650;letter-spacing:-.6px;font-size:18px}
#tt-concepts .tt-brand-sub{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-top:3px;color:#64748b}
#tt-concepts .tt-nav{display:flex;gap:22px;margin-left:auto;align-items:center}
#tt-concepts .tt-nav button{border:0;background:none;padding:9px 0;font-size:11px;color:inherit}
#tt-concepts .tt-login{background:transparent;border:1px solid #cbd5e1;color:inherit;border-radius:8px;padding:10px 16px;font-size:11px;white-space:nowrap}
#tt-concepts .tt-hero{position:relative;padding:43px 42px 50px}
#tt-concepts .tt-split{display:grid;grid-template-columns:1.08fr 1fr;align-items:center;gap:28px}
#tt-concepts .tt-eyebrow{font-size:10px;letter-spacing:.16em;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:24px;color:var(--tt-blue);line-height:1.5}
#tt-concepts .tt-dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
#tt-concepts h1{font-size:clamp(34px,5.5vw,66px);line-height:1.025;letter-spacing:-2.7px;font-weight:600;margin:0 0 24px;color:inherit}
#tt-concepts h1 em{font-style:normal;color:var(--tt-blue)}
#tt-concepts .tt-intro{font-size:14px;line-height:1.8;color:#64748b;max-width:340px;margin:0 0 28px}
#tt-concepts .tt-actions{display:flex;align-items:center;flex-wrap:wrap;gap:13px}
#tt-concepts .tt-button{display:inline-flex;align-items:center;justify-content:space-between;gap:20px;border:0;border-radius:9px;padding:14px 18px;font-size:12px;min-height:46px;transition:transform .2s,background .2s}
#tt-concepts .tt-button:hover{transform:translateY(-2px)}
#tt-concepts .tt-primary{background:var(--tt-blue);color:#fff}
#tt-concepts .tt-secondary{background:transparent;color:inherit;padding-left:4px;padding-right:4px}
#tt-concepts .tt-note{color:#718096;font-size:10px;line-height:1.5;margin-top:21px}
#tt-concepts .tt-footer{border-top:1px solid #e2e8f0;padding:23px 40px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:10px;color:#64748b}
#tt-concepts .tt-footer strong{font-weight:500;color:inherit}
#tt-concepts .tt-miniapp{border:1px solid #dbe3ef;background:#fff;border-radius:var(--tt-radius);box-shadow:0 24px 55px #0f172a14;overflow:hidden;transform:rotate(-2deg)}
#tt-concepts .tt-mini-top{background:#0f172a;padding:16px 18px;color:white;display:flex;justify-content:space-between;align-items:center;font-size:11px}
#tt-concepts .tt-demo-label{font-size:9px;color:#b2c2dd;letter-spacing:.08em}
#tt-concepts .tt-mini-body{padding:22px 20px}
#tt-concepts .tt-mini-title{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px;margin-bottom:16px}
#tt-concepts .tt-mini-title span{font-size:10px;color:#64748b}
#tt-concepts .tt-toggle{display:flex;background:#f1f5f9;border-radius:7px;padding:4px;gap:3px;margin-bottom:21px}
#tt-concepts .tt-toggle button{flex:1;border:0;border-radius:5px;background:transparent;padding:8px 4px;font-size:10px;color:#64748b;min-height:33px}
#tt-concepts .tt-toggle button[aria-pressed=true]{background:white;color:#2563eb;box-shadow:0 1px 4px #00000010}
#tt-concepts .tt-demo-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid #f1f5f9;font-size:11px}
#tt-concepts .tt-person{display:flex;align-items:center;gap:9px}
#tt-concepts .tt-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-size:10px;flex-shrink:0}
#tt-concepts .tt-demo-row small{font-size:9px;color:#64748b;display:block;margin-top:3px}
#tt-concepts .tt-tag{font-size:9px;color:#2563eb;background:#eff6ff;padding:5px 7px;border-radius:5px;white-space:nowrap}
#tt-concepts .tt-mini-foot{display:flex;gap:10px;align-items:center;margin-top:18px;font-size:10px;color:#64748b;line-height:1.5}
#tt-concepts .tt-mini-foot i{color:#2563eb}
#tt-concepts .tt-understrip{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding:26px 42px;background:#fff;border-top:1px solid #e2e8f0}
#tt-concepts .tt-understrip div{font-size:12px;display:flex;align-items:center;gap:9px;color:#475569}
#tt-concepts .tt-understrip i{color:#2563eb}
#tt-concepts .v0{background:radial-gradient(ellipse at 86% 40%,#dbeafe 0,transparent 44%),#f8fafc}
#tt-concepts .v1{background:#0b1222;color:#f1f5f9}
#tt-concepts .v1 .tt-header{border-bottom:1px solid #ffffff12}
#tt-concepts .v1 .tt-brand-sub,#tt-concepts .v1 .tt-intro{color:#9caec8}
#tt-concepts .v1 .tt-login{border-color:#334155}
#tt-concepts .v1 .tt-hero{padding-top:52px;padding-bottom:40px}
#tt-concepts .v1 .tt-eyebrow{color:#7ba7ff}
#tt-concepts .v1 h1{font-weight:400;letter-spacing:-2.1px;font-size:clamp(33px,5vw,61px)}
#tt-concepts .v1 h1 em{color:#82acff}
#tt-concepts .v1 .tt-footer{border-color:#263247;color:#a3b2c9}
#tt-concepts .tt-dial-space{position:relative;min-height:340px;display:flex;align-items:center;justify-content:center}
#tt-concepts .tt-dial{width:min(100%,300px);aspect-ratio:1;border:1px solid #334155;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#172a4c,transparent 65%);box-shadow:0 0 0 24px #ffffff02,0 0 0 25px #ffffff05}
#tt-concepts .tt-dial:before{content:"";position:absolute;inset:18px;border-radius:50%;border:16px solid #172846;border-top-color:#2563eb;border-right-color:#3b82f6;transform:rotate(-22deg)}
#tt-concepts .tt-dial-center{text-align:center;z-index:1}
#tt-concepts .tt-dial-center b{font-size:43px;font-weight:400;letter-spacing:-2px;display:block}
#tt-concepts .tt-dial-center span{font-size:10px;color:#94a3b8;letter-spacing:.14em}
#tt-concepts .tt-orbit-tag{position:absolute;background:#14223a;border:1px solid #34435d;border-radius:7px;padding:10px 13px;font-size:10px;z-index:1}
#tt-concepts .tt-orbit-tag.top{top:10px;right:0}
#tt-concepts .tt-orbit-tag.bottom{bottom:16px;left:0}
#tt-concepts .tt-dark-toggle{display:flex;gap:8px;justify-content:center}
#tt-concepts .tt-dark-toggle button{border:1px solid #334155;background:transparent;color:#a6b9d6;padding:9px 14px;border-radius:30px;font-size:11px}
#tt-concepts .tt-dark-toggle button[aria-pressed=true]{background:#2563eb;color:white;border-color:#2563eb}
#tt-concepts .tt-editorial-band{padding:24px 40px;border-top:1px solid #263247;display:flex;justify-content:space-between;gap:18px;color:#8f9fb7;font-size:11px;letter-spacing:.01em}
#tt-concepts .tt-editorial-band span:first-child{color:white}
#tt-concepts .v2{background:#eef2f7}
#tt-concepts .v2 .tt-header{background:#fff}
#tt-concepts .v2 .tt-hero{padding-top:45px;padding-bottom:44px}
#tt-concepts .v2 h1{font-size:clamp(32px,4.9vw,58px);font-weight:500;letter-spacing:-2.3px;line-height:1.08}
#tt-concepts .v2 h1 em{font-family:Georgia,serif;font-weight:400;font-style:italic;letter-spacing:-1.7px}
#tt-concepts .tt-human{position:relative;padding:17px 7px 0 15px}
#tt-concepts .tt-human-back{position:absolute;inset:0 12px 18px 29px;background:#2563eb;border-radius:var(--tt-radius);transform:rotate(5deg)}
#tt-concepts .tt-profile{position:relative;background:white;border-radius:var(--tt-radius);padding:24px;box-shadow:0 12px 40px #0f172a12}
#tt-concepts .tt-profile-top{display:flex;align-items:center;gap:12px;margin:16px 0 24px}
#tt-concepts .tt-profile-top .tt-avatar{height:59px;width:59px;border-radius:18px;font-size:19px;background:#0f172a;color:white}
#tt-concepts .tt-profile-name{font-size:17px;font-weight:500;margin-bottom:5px}
#tt-concepts .tt-profile-role{font-size:11px;color:#64748b}
#tt-concepts .tt-profile-title{font-size:10px;letter-spacing:.12em;color:#64748b;display:flex;justify-content:space-between;gap:5px}
#tt-concepts .tt-week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:19px}
#tt-concepts .tt-day{background:#eff6ff;border-radius:8px;padding:13px 2px;text-align:center;color:#1d4ed8;font-size:11px}
#tt-concepts .tt-day span{display:block;font-size:9px;color:#64748b;margin-top:7px}
#tt-concepts .tt-day.off{background:#f1f5f9;color:#64748b}
#tt-concepts .tt-profile-hint{background:#f8fafc;padding:12px;border-radius:8px;font-size:10px;line-height:1.65;color:#475569}
#tt-concepts .tt-people-switch{display:flex;justify-content:center;gap:8px;position:relative;margin-top:19px}
#tt-concepts .tt-people-switch button{background:white;border:1px solid #cbd5e1;border-radius:7px;padding:9px 10px;font-size:10px;color:#475569}
#tt-concepts .tt-people-switch button[aria-pressed=true]{background:#0f172a;color:white;border-color:#0f172a}
#tt-concepts .tt-human-strip{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;padding:26px 40px;gap:20px}
#tt-concepts .tt-human-strip b{font-size:12px;font-weight:500;display:block;margin-bottom:7px}
#tt-concepts .tt-human-strip span{font-size:11px;color:#64748b;line-height:1.6}
#tt-concepts .v3{background:#2563eb;color:white}
#tt-concepts .v3 .tt-logomark{background:white;color:#2563eb}
#tt-concepts .v3 .tt-brand-sub{color:#ccddff}
#tt-concepts .v3 .tt-login{border-color:#ffffff55}
#tt-concepts .v3 .tt-header{border-bottom:1px solid #ffffff25}
#tt-concepts .v3 .tt-hero{padding-top:40px;padding-bottom:30px}
#tt-concepts .tt-rhythm-top{display:flex;align-items:flex-end;justify-content:space-between;gap:35px}
#tt-concepts .v3 h1{font-size:clamp(35px,6.8vw,79px);letter-spacing:-3.4px;line-height:.98;max-width:590px}
#tt-concepts .v3 h1 em{color:#bfdbfe}
#tt-concepts .v3 .tt-eyebrow{color:#dbeafe;margin-bottom:22px}
#tt-concepts .v3 .tt-intro{color:#e3ecff;font-size:12px;margin-bottom:19px}
#tt-concepts .v3 .tt-primary{background:white;color:#1d4ed8}
#tt-concepts .tt-rhythm-side{width:240px;flex-shrink:0;padding-bottom:24px}
#tt-concepts .tt-timeboard{background:#0f172a;border-radius:var(--tt-radius);padding:23px 26px;margin-top:10px}
#tt-concepts .tt-timeboard-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:22px;font-size:12px}
#tt-concepts .tt-timeboard-head small{font-size:9px;color:#a2b4cd;display:block;margin-top:6px}
#tt-concepts .tt-rhythm-toggle{display:flex;gap:5px}
#tt-concepts .tt-rhythm-toggle button{border:1px solid #3b4b65;background:transparent;color:#c8d6ed;padding:9px 11px;border-radius:6px;font-size:10px;min-height:34px}
#tt-concepts .tt-rhythm-toggle button[aria-pressed=true]{background:#2563eb;color:#fff;border-color:#2563eb}
#tt-concepts .tt-schedule-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
#tt-concepts .tt-shiftcell{background:#213a66;border-top:2px solid #5892ff;border-radius:5px;min-height:71px;padding:10px 8px;font-size:10px;color:#9ab6e5}
#tt-concepts .tt-shiftcell b{display:block;font-size:11px;font-weight:500;margin-top:12px;color:#fff}
#tt-concepts .tt-shiftcell.off{background:#182236;border-top-color:#3a4860;color:#8897af}
#tt-concepts .tt-shiftcell.off b{color:#9aa8bd}
#tt-concepts .tt-schedule-foot{font-size:10px;color:#a0b3cd;margin-top:15px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#tt-concepts .v3 .tt-footer{border-color:#ffffff25;color:#dbeafe}
#tt-concepts .v4{background:#f8fafc}
#tt-concepts .tt-portal{display:grid;grid-template-columns:1.05fr 1fr;min-height:540px}
#tt-concepts .tt-portal-left{background:#0f172a;color:white;padding:34px 40px 28px;position:relative;overflow:hidden;display:flex;flex-direction:column}
#tt-concepts .tt-portal-left .tt-brand-sub{color:#91a4c0}
#tt-concepts .tt-portal-copy{margin-top:62px;position:relative;z-index:1}
#tt-concepts .tt-portal-left h1{font-size:clamp(34px,4.8vw,57px);font-weight:500;line-height:1.06;letter-spacing:-2px}
#tt-concepts .tt-portal-left h1 em{color:#78a8ff}
#tt-concepts .tt-portal-left .tt-intro{color:#9fb0cc;font-size:12px}
#tt-concepts .tt-portal-left .tt-note{margin-top:auto;color:#a1b3cd;padding-top:25px;z-index:1}
#tt-concepts .tt-portal-art{position:absolute;width:350px;height:350px;right:-205px;bottom:-90px;border:52px solid #2563eb;border-radius:50%;opacity:.65;transform:rotate(-25deg)}

#tt-concepts .tt-portal-right h2{font-size:25px;font-weight:500;line-height:1.2;letter-spacing:-.8px;margin:9px 0 13px}
#tt-concepts .tt-portal-right p{font-size:12px;color:#64748b;line-height:1.6;margin:0 0 24px}
#tt-concepts .tt-role-options{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
#tt-concepts .tt-role-option{display:flex;align-items:center;gap:12px;padding:14px 15px;border:1px solid #dbe3ef;border-radius:9px;background:#fff;text-align:left;color:#475569;min-height:60px}
#tt-concepts .tt-role-option[aria-pressed=true]{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
#tt-concepts .tt-role-option b{font-size:12px;font-weight:500;display:block}
#tt-concepts .tt-role-option small{display:block;font-size:10px;color:#64748b;margin-top:5px}
#tt-concepts .tt-role-option .tt-radio{width:14px;height:14px;border:1px solid #b3c2d5;border-radius:50%;margin-left:auto;flex-shrink:0}
#tt-concepts .tt-role-option[aria-pressed=true] .tt-radio{border:4px solid #2563eb;background:#fff}
#tt-concepts .tt-portal-right .tt-button{width:100%}
#tt-concepts .tt-portal-right .tt-note{text-align:center;font-size:10px;margin:14px 0 0}
#tt-concepts .tt-overlay{position:absolute;inset:0;background:#0f172aad;z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:80px 20px 25px;backdrop-filter:blur(5px)}
#tt-concepts .tt-overlay[hidden]{display:none}
#tt-concepts .tt-dialog{position:relative;border-radius:var(--tt-radius);background:#fff;color:#15213b;max-width:460px;width:100%;padding:32px;box-shadow:0 20px 100px #0005}
#tt-concepts .tt-dialog h2{font-size:27px;letter-spacing:-.9px;font-weight:500;margin:12px 0 22px}
#tt-concepts .tt-dialog p{font-size:13px;line-height:1.7;color:#64748b}

#tt-concepts .tt-dialog li{padding:12px 0;border-bottom:1px solid #e2e8f0;line-height:1.6}
#tt-concepts .tt-close{position:absolute;right:14px;top:12px;background:#f1f5f9;border:0;border-radius:50%;height:32px;width:32px;font-size:22px;color:#475569}
#tt-concepts .tt-fallback{padding:70px;font-size:40px}
#tt-concepts .tt-avatar,#tt-concepts .tt-dial,#tt-concepts .tt-shiftcell{transition:background .25s,transform .25s}

/* Desktop-first revision for PPL Group */
#tt-concepts{max-width:1440px;margin-inline:auto;font-size:16px}

function render4(){return `<main class="tt-portal"><div class="tt-portal-left">${brand()}<div class="tt-portal-copy"><div class="tt-eyebrow" style="color:#8cb4ff">ЛИЧНОЕ РАБОЧЕЕ ПРОСТРАНСТВО</div><h1>Хороший день<br>начинается<br>с <em>ясного<br>плана.</em></h1><p class="tt-intro">Всё, что важно для вашего рабочего времени, — в одном месте.</p></div><div class="tt-note">Планы. Люди. Решения.<br>TimeTrack Pro</div><div class="tt-portal-art" aria-hidden="true"></div></div><div class="tt-portal-right"><div class="tt-eyebrow">ДОБРО ПОЖАЛОВАТЬ</div><h2>Ваш взгляд на рабочий день.</h2><p>Выберите роль для знакомства<br>с возможностями системы.</p><div class="tt-role-options">${Object.entries(roles).map(([k,v])=>`<button type="button" class="tt-role-option" data-role="${k}" aria-pressed="${role===k}">${icon(v.icon)}<span><b>${v.title}</b><small>${v.sub}</small></span><span class="tt-radio" aria-hidden="true"></span></button>`).join('')}</div><button type="button" class="tt-button tt-primary" data-action="role-demo">Открыть демо-пространство <span>↗</span></button><div class="tt-note">Без регистрации · только демонстрационные данные</div></div></main>${footer()}`;}

 <h3 class="tt-auth-title">${registration?'Ваше рабочее пространство':'С возвращением'}</h3>

 <form class="tt-account-form" data-form-mode="${current}" novalidate autocomplete="off">
 <div class="tt-fields">

 <label class="tt-field wide">Рабочий email *<input name="email" type="email" autocomplete="username" required maxlength="254" placeholder="name@example.com" autocapitalize="none" spellcheck="false"></label>

 <label class="tt-field ${registration?'':'wide'}">Пароль *<span class="tt-password"><input name="password" type="password" autocomplete="${registration?'new-password':'current-password'}" required minlength="${registration?'12':'1'}" maxlength="128" placeholder="${registration?'Не менее 12 символов':'Введите пароль'}"><button type="button" data-password="password" aria-pressed="false" aria-label="Показать пароль">Показать</button></span>${registration?'<small>Не используйте настоящий рабочий пароль в макете.</small>':''}</label>
 ${registration?'<label class="tt-field">Повторите пароль *<span class="tt-password"><input name="confirmPassword" type="password" autocomplete="new-password" required maxlength="128" placeholder="Повторите пароль"><button type="button" data-password="confirmPassword" aria-pressed="false" aria-label="Показать подтверждение пароля">Показать</button></span></label>':''}
 </div><div class="tt-demo-warning">Демонстрационная форма: данные не отправляются и не сохраняются. Используйте вымышленные данные.</div>
 <button type="submit" class="tt-button tt-primary tt-form-submit">${registration?'Проверить регистрацию':'Проверить вход'} <span>↗</span></button>
 <div class="tt-form-message" role="status" aria-live="polite"></div>
 <div class="tt-form-meta">${registration?'* Обязательные поля. В рабочей системе доступ подтверждает администратор. Самостоятельное назначение привилегий не предусмотрено.':'Проверяется только заполнение формы. Для настоящего входа потребуется сервер авторизации.'}</div>

}
function renderPortalRegistration(){return `<main class="tt-portal"><div class="tt-portal-left">${brand()}<div class="tt-client-line">Заказчик <strong>PPL Group</strong></div><div class="tt-portal-copy"><div class="tt-eyebrow">КОРПОРАТИВНОЕ РАБОЧЕЕ ПРОСТРАНСТВО</div><h1>Хороший день<br>начинается<br>с <em>ясного<br>плана.</em></h1><p class="tt-intro">Графики, персональные условия и рабочее время — в одном продукте.</p><button type="button" class="tt-button tt-primary" data-action="demo">Посмотреть демо <span>↗</span></button><div class="tt-portal-note">Основная работа — на десктопе.<br>Нужные действия — с любого устройства.</div></div><div class="tt-portal-art" aria-hidden="true"></div></div><div class="tt-portal-right"><div class="tt-authmount">${authMarkup(authMode)}</div></div></main>${footer()}`;}
function draw(){
 page.className='tt-page v'+variant;
 page.innerHTML=[render0,render1,render2,render3,renderPortalRegistration][variant]();
 root.querySelector('#tt-direction').textContent=titles[variant];
 root.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.variant)===variant)));
 if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});
}
function openDialog(action,trigger){lastFocus=trigger;const content=root.querySelector('#tt-dialog-content');const title=root.querySelector('#tt-dialog-title');if(action==='solution'){title.textContent='От графика до ясного решения';content.innerHTML='<ul><li>01 · Назначьте график и персональные исключения.</li><li>02 · Загрузите события проходов RusGuard.</li><li>03 · Проверьте план-факт и спорные ситуации.</li><li>04 · Получите сводку и контрольный отчёт.</li></ul>';}else if(action==='roles'){title.textContent='Одно пространство для команды';content.innerHTML='<ul><li>HR — карточки сотрудников, планы и история изменений.</li><li>Руководитель — показатели своего подразделения.</li><li>Сотрудник — личный график и согласования.</li></ul>';}else{title.textContent=action==='role-demo'?roles[role].title:'Рабочий день — целиком';const text=action==='role-demo'&&role==='manager'?'В рабочей системе здесь будет аналитика вашего подразделения.':action==='role-demo'&&role==='employee'?'В рабочей системе здесь будет ваш персональный график.':'Пример детализации одного рабочего дня.';content.innerHTML=`<p>${text}</p><div class="tt-mini-title">Демонстрационный сотрудник <span>График 5/2</span></div><ul><li>План: 09:00–18:00, перерыв 60 минут.</li><li>Проходы: вход 09:00, выход 18:00.</li><li>Присутствие: 9 часов. По правилу примера к учёту — 8 часов.</li></ul><p>Интерфейсный эскиз. Это не авторизация и не подключение к RusGuard.</p>`;}overlay.hidden=false;root.querySelector('.tt-close').focus();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.variant!==undefined){variant=Number(b.dataset.variant);draw();}else if(b.dataset.mode){mode=b.dataset.mode;draw();page.querySelector(`[data-mode="${mode}"]`).focus();}else if(b.dataset.shift){shift=b.dataset.shift;draw();page.querySelector(`[data-shift="${shift}"]`).focus();}else if(b.dataset.person!==undefined){person=Number(b.dataset.person);draw();page.querySelector(`[data-person="${person}"]`).focus();}else if(b.dataset.rhythm){rhythm=b.dataset.rhythm;draw();page.querySelector(`[data-rhythm="${rhythm}"]`).focus();}else if(b.dataset.role){role=b.dataset.role;draw();page.querySelector(`[data-role="${role}"]`).focus();}else if(b.dataset.action==='close'){overlay.hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}else if(b.dataset.action){openDialog(b.dataset.action,b);}});
function clearAccountForms(container){container.querySelectorAll('.tt-account-form').forEach(f=>f.reset());}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.action==='register'||b.dataset.action==='login'){
  e.stopImmediatePropagation();lastFocus=b;authMode=b.dataset.action==='register'?'register':'login';
  root.querySelector('.tt-dialog').classList.add('auth-dialog');
  root.querySelector('#tt-dialog-title').textContent=authMode==='register'?'Регистрация в TimeTrack Pro':'Вход в TimeTrack Pro';
  root.querySelector('#tt-dialog-content').innerHTML=`<div class="tt-authmount">${authMarkup(authMode)}</div>`;
  overlay.hidden=false;root.querySelector('.tt-close').focus();
 }else if(b.dataset.authMode){
  e.stopImmediatePropagation();authMode=b.dataset.authMode;const mount=b.closest('.tt-authmount');clearAccountForms(mount);mount.innerHTML=authMarkup(authMode);mount.querySelector(`[data-auth-mode="${authMode}"]`).focus();
  if(!overlay.hidden)root.querySelector('#tt-dialog-title').textContent=authMode==='register'?'Регистрация в TimeTrack Pro':'Вход в TimeTrack Pro';
 }else if(b.dataset.password){
  e.stopImmediatePropagation();const input=b.closest('form').elements.namedItem(b.dataset.password);const show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'Скрыть':'Показать';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',show?'Скрыть пароль':'Показать пароль');
 }else if(b.dataset.action==='close'){
  clearAccountForms(overlay);
 }else if(b.dataset.action){root.querySelector('.tt-dialog').classList.remove('auth-dialog');}
},true);
root.addEventListener('input',e=>{if(e.target.matches('.tt-account-form input')){const f=e.target.form;for(const el of f.querySelectorAll('input')){el.setCustomValidity('');el.removeAttribute('aria-invalid');}const message=f.querySelector('.tt-form-message');message.textContent='';message.classList.remove('success');}});
root.addEventListener('submit',e=>{
 const form=e.target;if(!form.matches('.tt-account-form'))return;e.preventDefault();
 const message=form.querySelector('.tt-form-message');message.textContent='';message.classList.remove('success');
 const email=form.elements.namedItem('email');email.value=email.value.trim();
 for(const input of form.querySelectorAll('input')){input.setCustomValidity('');input.removeAttribute('aria-invalid');}
 if(form.dataset.formMode==='register'){
  const fullName=form.elements.namedItem('fullName');fullName.value=fullName.value.trim();if(fullName.value.length<2)fullName.setCustomValidity('Укажите ФИО.');
  const p=form.elements.namedItem('password'),confirm=form.elements.namedItem('confirmPassword');
  if(p.value.length<12)p.setCustomValidity('Для примера регистрации нужен пароль не короче 12 символов.');
  if(p.value!==confirm.value)confirm.setCustomValidity('Пароли не совпадают.');
 }
 if(!form.checkValidity()){
  const invalid=[...form.querySelectorAll('input')].find(x=>!x.validity.valid);if(invalid){invalid.setAttribute('aria-invalid','true');message.textContent=invalid.validationMessage;invalid.focus();}form.reportValidity();return;
 }
 const isReg=form.dataset.formMode==='register';form.reset();
 form.querySelectorAll('[data-password]').forEach(b=>{b.textContent='Показать';b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','Показать пароль');});
 form.querySelectorAll('[name=password],[name=confirmPassword]').forEach(input=>input.type='password');
 message.classList.add('success');message.textContent=isReg?'Поля проверены. Это демо: заявка не отправлена, учётная запись не создана. Данные формы очищены.':'Поля проверены. Это демо: вход в систему не выполнен. Данные формы очищены.';
});
root.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'){clearAccountForms(overlay);overlay.hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}if(e.key==='Tab'){const list=[...overlay.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled&&el.getClientRects().length>0);if(!list.length)return;if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list[list.length-1].focus();}else if(!e.shiftKey&&document.activeElement===list[list.length-1]){e.preventDefault();list[0].focus();}}});
draw();
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{root.style.setProperty('--tt-blue',tweakState.accent);root.style.setProperty('--tt-radius',tweakState.radius+'px');}});t.addColorPicker(tweakState,'accent',{label:'Акцент продукта',reference:'--tt-blue'});t.addSlider(tweakState,'radius',{label:'Скругление панелей',min:0,max:28,unit:'px'});}
})();
</script><script>if(window.parent!==window){const notify=()=>parent.postMessage({type:'tt-preview-height',height:document.documentElement.scrollHeight},'*');new ResizeObserver(notify).observe(document.body);window.addEventListener('load',notify);}</script></body></html>
